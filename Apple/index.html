<!doctype html>
<html class="page" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/index.css" />
    <link rel="icon" href="./icons/favicon.ico" type="image/x-icon" />
    <title>Apple</title>
    <script src="./js/index.js" type="module"></script>
  </head>
  <body class="page__body">
    <header class="header">
      <div class="container header__container">
        <a class="header__logo logo" href="#">
          <img class="logo__img" src="./icons/logo.svg" alt="Logo" />
        </a>
        <nav class="header__menu" id="header__menu">
          <ul class="menu__list">
            <li class="menu__item">
              <a class="menu__link" href="#Support">Support</a>
            </li>
            <li class="menu__item">
              <a class="menu__link" href="#solutions">solutions</a>
            </li>
            <li class="menu__item">
              <a class="menu__link" href="#about">about</a>
            </li>
            <li class="menu__item">
              <a class="menu__link" href="#Support">Support</a>
            </li>
          </ul>
        </nav>
        <div class="header__actions">
          <button class="header__actions-button" aria-label="Search" title="Search">
            <svg width="24px" height="24">
              <use class="header__actions-icon" href="./icons/sprite.svg#search"></use>
            </svg>
          </button>
          <button class="header__actions-button" aria-label="Cart" title="Cart">
            <svg width="24px" height="24">
              <use class="header__actions-icon" href="./icons/sprite.svg#cart"></use>
            </svg>
          </button>
          <button
            class="header__burger"
            aria-label="Open the burger"
            aria-expanded="false"
            aria-controls="header__menu">
            <svg width="24px" height="24">
              <use class="burger__menu-icon" href="./icons/sprite.svg#burger-menu"></use>
              <use class="burger__menu-cross" href="./icons/sprite.svg#menu-cross"></use>
            </svg>
          </button>
        </div>
      </div>
    </header>

    <main class="main">
      <section class="section">
        <div class="container hero__container">
          <div class="hero__inner">
            <div class="hero__info">
              <h1 class="title hero__title">The new phones are here take a look.</h1>
              <p class="hero__desc slider-desc">
                Lorem ipsum dolor sit amet, consectetur adipiscing elit. Scelerisque in est dui,
                aliquam, tempor. Faucibus morbi turpis.
              </p>
              <a class="button" aria-label="Explore" href="#"> Explore</a>
            </div>
            <img
              class="hero__image"
              width="647"
              height="550"
              src="./images/slider-1-img.png"
              alt="An image of the latest iPhone models" />
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
